aid: genies
name: Genies
description: >-
  Genies is an AI avatar and digital-identity company that powers the visual and
  embodiment layer for AI. Founded in 2017 and headquartered in West Hollywood /
  Venice, California, Genies builds high-fidelity, fully customizable 3D avatars
  and "Smart Avatars" — LLM- and behavior-driven digital characters that can act,
  react, converse, and persist across games, apps, and XR experiences. For
  developers, Genies ships a Unity-based Avatar SDK (C#) with avatar loading,
  a customization API for wearables/hair/makeup/tattoos, and asset pre-caching,
  supporting iOS, Android, Windows Standalone, and VR. Developers register a
  project in the Genies Developer Hub to obtain API keys used by the SDK. Backed
  by Bond Capital, Multicoin Capital, and Trinity Ventures.
